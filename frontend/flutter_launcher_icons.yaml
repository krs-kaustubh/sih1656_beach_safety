# File: flutter_launcher_icons.yaml
# Description: Configuration for generating Android adaptive icons and iOS app launcher icons for the beach safety app.

# Generates app launcher icons for both platforms.
# Command: dart run flutter_launcher_icons
# The source art uses a navy card with the shield emblem. Android adaptive icon uses navy background with card inset into safe zone.

flutter_launcher_icons:
  image_path: "assets/branding/icon.png"

  android: "ic_launcher"
  adaptive_icon_background: "#01214E"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"

  ios: true
  # iOS rejects icons with an alpha channel, so it gets the flattened art.
  remove_alpha_ios: true
