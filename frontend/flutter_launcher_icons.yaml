# Generates the Lehar app icons for both platforms.
#   dart run flutter_launcher_icons
#
# The source art is a navy card with the shield emblem. Android's adaptive
# icon uses the same navy as its background and the card inset into the safe
# zone as its foreground, so the padding blends and no shape mask can clip
# the emblem.
flutter_launcher_icons:
  image_path: "assets/branding/icon.png"

  android: "ic_launcher"
  adaptive_icon_background: "#01214E"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"

  ios: true
  # iOS rejects icons with an alpha channel, so it gets the flattened art.
  remove_alpha_ios: true
