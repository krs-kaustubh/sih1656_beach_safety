# File: flutter_native_splash.yaml
# Description: Configuration for generating native splash screen launch visuals for Android and iOS.

# Launch screen setup for both platforms.
# Command: dart run flutter_native_splash:create
# Navy background matches app icon color to prevent white flashes on app launch.

flutter_native_splash:
  color: "#01214E"
  image: assets/branding/icon_foreground.png
  android_12:
    color: "#01214E"
    image: assets/branding/icon_foreground.png
    icon_background_color: "#01214E"
